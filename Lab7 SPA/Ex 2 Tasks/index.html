<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Список задач</h1>
    <p>Лабораторная работа № 7  SPA без фреймворков</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Фильтр задач">
    <button type="button" role="tab" data-page="all">Все <span class="count" data-count="all">0</span></button>
    <button type="button" role="tab" data-page="active">Активные <span class="count" data-count="active">0</span></button>
    <button type="button" role="tab" data-page="done">Выполненные <span class="count" data-count="done">0</span></button>
  </nav>

  <section class="panel">
    <form id="task-form" novalidate>
      <input id="task-input" type="text" maxlength="80" placeholder="Новая задача…" aria-label="Название задачи">
      <button class="btn" type="submit">Добавить</button>
    </form>
    <p id="form-error" class="error" role="alert"></p>
  </section>

  <main id="content" aria-live="polite"></main>

  <script src="app.js" defer></script>
</body>
</html>
