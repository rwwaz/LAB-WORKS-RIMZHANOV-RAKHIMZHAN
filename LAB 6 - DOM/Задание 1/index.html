<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Задание 2 Счётчик</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Счётчик</h1>
    <div id="value">0</div>
    <div class="buttons">
      <button id="minus">-</button>
      <button id="reset">Сброс</button>
      <button id="plus">+</button>
    </div>
    <p>Всего нажатий: <span id="clicks">0</span></p>
    <ul id="history"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
