<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант 1. Конвертер температур</title>
 
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Конвертер температур</h1>

    <label>Значение <input id="value" type="text" inputmode="decimal" placeholder="например, 36,6"></label>

    <label>Из <select id="from"></select></label>
    <label>В <select id="to"></select></label>

    <button id="convert" type="button">Конвертировать</button>
    <button id="swap" type="button">Поменять местами</button>

    <p id="result" aria-live="polite"></p>
  </main>

  <script type="module" src="./main.js"></script>

  <script>
    window.addEventListener("load", function () {
      if (!window.__esModulesLoaded) {
        var s = document.createElement("script");
        s.src = "./bundle.js";
        document.body.appendChild(s);
      }
    });
  </script>
</body>
</html>
