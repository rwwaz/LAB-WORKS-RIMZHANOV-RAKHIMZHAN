<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Форма заказа товара</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Заказ товара</h1>

  <form id="orderForm">
    <label for="product">Товар:</label>
    <select id="product">
      <option value="">Выберите товар</option>
      <option value="Ноутбук">Ноутбук</option>
      <option value="Телефон">Телефон</option>
      <option value="Наушники">Наушники</option>
    </select>

    <label for="qty">Количество:</label>
    <input type="number" id="qty" placeholder="Введите количество">

    <label>Способ доставки:</label>
    <div class="radio-group">
      <label><input type="radio" name="delivery" value="Курьер"> Курьер</label>
      <label><input type="radio" name="delivery" value="Самовывоз"> Самовывоз</label>
      <label><input type="radio" name="delivery" value="Почта"> Почта</label>
    </div>

    <label>Дополнительные услуги:</label>
    <div class="checkbox-group">
      <label><input type="checkbox" name="extra" value="Упаковка"> Подарочная упаковка</label>
      <label><input type="checkbox" name="extra" value="Страховка"> Страховка</label>
    </div>

    <button type="submit">Оформить заказ</button>
  </form>

  <p id="result"></p>

  <script src="script.js"></script>
</body>
</html>
