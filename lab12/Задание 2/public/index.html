<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог книг</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Каталог книг</h1>
  <p id="status" role="status"></p>

  <section id="guest">
    <p><b>Гость:</b> каталог доступен для просмотра. Чтобы добавлять записи, войдите.</p>
    <form id="loginForm" novalidate>
      <div class="row">
        <div><label for="login">Логин</label><input id="login" autocomplete="username"></div>
        <div><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password"></div>
      </div>
      <button type="submit">Войти</button>
    </form>
    <p class="hint">Тестовые учётные записи: <b>librarian</b> / Library#Test2026, <b>reader</b> / Reader#Test2026.</p>
  </section>

  <section id="user" hidden>
    <div class="bar">
      <div>Вы вошли как <b id="who"></b></div>
      <button id="logout" class="secondary" type="button">Выйти</button>
    </div>
    <h2>Добавить книгу</h2>
    <form id="addForm" novalidate>
      <div class="row">
        <div><label for="title">Название</label><input id="title"></div>
        <div><label for="author">Автор</label><input id="author"></div>
        <div><label for="year">Год</label><input id="year" type="number"></div>
      </div>
      <button type="submit">Добавить</button>
    </form>
  </section>

  <section>
    <h2>Книги</h2>
    <ul class="list" id="books"></ul>
  </section>
</main>
<script src="common.js"></script>
<script src="mock.js"></script>
<script src="mock-core.js"></script>
<script src="app.js"></script>
</body>
</html>
