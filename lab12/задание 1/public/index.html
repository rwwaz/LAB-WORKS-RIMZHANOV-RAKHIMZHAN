<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личный кабинет участника курса</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Личный кабинет участника курса</h1>
  <p id="status" role="status"></p>

  <section id="guest">
    <form id="loginForm" novalidate>
      <label for="login">Логин</label>
      <input id="login" name="login" autocomplete="username">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="submit">Войти</button>
    </form>
    <p class="hint">Тестовые учётные записи: <b>anna</b> / Anna#Test2026 (курс Веб), <b>boris</b> / Boris#Test2026 (курс Python).</p>
  </section>

  <div id="private" hidden>
    <section>
      <div class="bar">
        <div><b id="who"></b> <span class="badge" id="role"></span></div>
        <span id="timer" aria-live="off"></span>
        <button id="logout" class="secondary" type="button">Выйти</button>
      </div>
      <h2 id="courseTitle"></h2>
      <ul class="list" id="lessons"></ul>
      <div id="lessonDetail" class="detail" hidden></div>
    </section>
    <section>
      <h2>Проверка защиты на сервере</h2>
      <form id="byIdForm">
        <label for="lessonId">Открыть занятие по номеру (1–6)</label>
        <input id="lessonId" type="number" min="1" max="99">
        <button type="submit" class="secondary">Запросить</button>
      </form>
    </section>
  </div>
</main>
<script src="common.js"></script>
<script src="mock.js"></script>
<script src="mock-core.js"></script>
<script src="app.js"></script>
</body>
</html>
